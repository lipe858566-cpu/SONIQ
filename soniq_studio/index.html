<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SONIQ Studio 1.1</title><style>
:root{font-family:system-ui,sans-serif;color:#f6f0ff;background:#0b0715}*{box-sizing:border-box}body{margin:0;padding:32px;max-width:1100px;margin:auto}h1{color:#c9a0ff}h2{margin-top:0}section{background:#1c1230;border:1px solid #4c3170;border-radius:18px;padding:24px;margin:18px 0}label{display:block;margin:12px 0 5px}input,button,select,textarea{font:inherit;border-radius:9px;padding:11px;border:1px solid #695184}input,select,textarea{width:100%;background:#110b20;color:white}button{background:#873bf0;color:white;cursor:pointer;margin:8px 8px 8px 0}button:disabled{opacity:.5;cursor:wait}.secondary{background:#36254e}.danger{background:#8d2453}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.hidden{display:none}#message{white-space:pre-wrap;color:#d7b6ff}.track{padding:14px;border-bottom:1px solid #48305e}.track strong{display:block}small{color:#bcaad1}</style></head><body>
<h1>✦ SONIQ Studio 1.1</h1><p>Gerencie o catálogo musical do SONIQ sem recompilar o aplicativo.</p>
<section id="setup"><h2>Conectar ao Supabase</h2><p>Use somente a URL e a chave publicável (anon). Nunca utilize service_role aqui.</p><label>URL do projeto</label><input id="url" placeholder="https://seu-projeto.supabase.co"><label>Chave publicável</label><input id="key" type="password" placeholder="sb_publishable_..."><button id="connect">Conectar</button></section>
<section id="login" class="hidden"><h2>Login administrativo</h2><label>E-mail</label><input id="email" type="email"><label>Senha</label><input id="password" type="password"><button id="signIn">Entrar</button></section>
<div id="admin" class="hidden"><section><h2 id="formTitle">Cadastrar música</h2><form id="trackForm"><div class="grid"><div><label>Título *</label><input id="title" required maxlength="200"></div><div><label>Artista *</label><input id="artist" required maxlength="200"></div><div><label>Álbum</label><input id="album"></div><div><label>Gênero</label><input id="genre"></div><div><label>Ano de lançamento</label><input id="year" type="number" min="1800" max="2200"></div><div><label>Duração (segundos)</label><input id="duration" type="number" min="0" value="0"></div></div><label>Áudio (MP3, M4A, OGG, FLAC ou WAV)</label><input id="audio" type="file" accept="audio/*"><label>Capa (JPG, PNG, WEBP)</label><input id="cover" type="file" accept="image/jpeg,image/png,image/webp"><label>Letra sincronizada LRC</label><textarea id="lrc" rows="5" placeholder="[00:12.00] Primeira linha"></textarea><label><input id="published" type="checkbox" style="width:auto"> Publicar no catálogo</label><button id="save" type="submit">Salvar música</button><button id="cancel" type="button" class="secondary">Cancelar edição</button></form></section><section><h2>Catálogo <span id="count"></span></h2><button id="refresh" class="secondary">Atualizar</button><button id="logout" class="secondary">Sair</button><div id="tracks"></div></section></div>
<p id="message" role="status"></p><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="config.js"></script><script src="app.js"></script></body></html>
